<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Application Sudoku</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { margin-bottom: 10px; color: #333; }
        .game-container {
            display: flex;
            gap: 20px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        /* Grille de Sudoku plus grande (60px par cellule) */
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 60px);
            grid-template-rows: repeat(9, 60px);
            border: 3px solid #333;
            background-color: #333;
            gap: 1px;
            user-select: none;
        }
        .cell {
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
        }
        /* Épaississement des bordures 3x3 */
        .cell:nth-child(3n) { border-right: 2px solid #333; }
        .cell:nth-child(9n) { border-right: none; }
        .sudoku-grid > div:nth-child(n+19):nth-child(-n+27),
        .sudoku-grid > div:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid #333;
        }

        /* Style de sélection : Contour bleu épais et gestion des bordures internes */
        .cell.selected {
            outline: 3px solid #007bff;
            outline-offset: -3px;
            z-index: 10;
        }

        /* Styles des chiffres et annotations */
        .cell-value { z-index: 3; }
        .locked { color: #000 !important; }
        .user-placed { color: #1976d2; }
        
        /* Notes centrales bien collées au centre */
        .center-notes {
            position: absolute;
            font-size: 11px;
            color: #555;
            text-align: center;
            width: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            letter-spacing: 0.5px;
            z-index: 2;
            pointer-events: none;
        }

        /* Notes de coin : Uniquement en haut à gauche, fixes */
        .corner-notes {
            position: absolute;
            font-size: 11px;
            color: #555;
            top: 3px;
            left: 4px;
            letter-spacing: 1px;
            z-index: 2;
            pointer-events: none;
        }

        /* Panneau de contrôle */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 250px;
        }
        .section-title { font-size: 14px; font-weight: bold; color: #555; margin-bottom: 5px; }
        
        .modes, .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }
        button {
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #f8f9fa;
            transition: all 0.2s;
        }
        button:hover { background: #e2e6ea; }
        button.active-mode { background: #007bff; color: white; border-color: #0056b3; }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
        }
        .actions button { font-size: 14px; }
        .full-width { grid-column: span 2; }

        /* Couleurs de surbrillance */
        .color-btn-1 { background-color: #ffcccc !important; }
        .color-btn-2 { background-color: #ffe5cc !important; }
        .color-btn-3 { background-color: #ffffcc !important; }
        .color-btn-4 { background-color: #e5ffcc !important; }
        .color-btn-5 { background-color: #ccffcc !important; }
        .color-btn-6 { background-color: #ccffe5 !important; }
        .color-btn-7 { background-color: #ccffff !important; }
        .color-btn-8 { background-color: #cce5ff !important; }
        .color-btn-9 { background-color: #e5ccff !important; }
    </style>
</head>
<body>

    <h1>Mon Application Sudoku</h1>
    <div class="game-container">
        <!-- Grille 9x9 -->
        <div class="sudoku-grid" id="grid"></div>

        <!-- Contrôles et options -->
        <div class="control-panel">
            <div>
                <div class="section-title">Modes de saisie</div>
                <div class="modes">
                    <button id="mode-digit" class="active-mode" onclick="setMode('digit')">Chiffre</button>
                    <button id="mode-center" onclick="setMode('center')">Notes C.</button>
                    <button id="mode-corner" onclick="setMode('corner')">Notes Coin</button>
                    <button id="mode-color" onclick="setMode('color')" class="full-width">Couleurs</button>
                </div>
            </div>

            <div>
                <div class="section-title" id="numpad-title">Pavé Numérique</div>
                <div class="numpad" id="numpad"></div>
            </div>

            <div>
                <div class="section-title">Actions</div>
                <div class="actions">
                    <button onclick="clearData()">🗑 Del</button>
                    <button onclick="toggleLock()" id="lock-btn">🔒 Lock</button>
                    <button onclick="undo()">Annuler</button>
                    <button onclick="redo()">Rétablir</button>
                    <button onclick="resetGrid()">Reset</button>
                    <button onclick="checkGrid()" style="background-color: #28a745; color: white;">Check</button>
                </div>
            </div>
        </div>
    </div>

<script>
    const GRID_SIZE = 9;
    let selectedCells = new Set(); // Gestion de la sélection multiple
    let isMouseDown = false;
    let currentMode = 'digit'; 
    let isLocked = false;
    
    let board = Array(81).fill().map(() => ({
        value: 0,
        centerNotes: new Set(),
        cornerNotes: new Set(),
        color: null,
        locked: false,
        userPlaced: false
    }));

    let history = [];
    let redoStack = [];

    function saveState() {
        history.push(JSON.stringify(board));
        redoStack = [];
    }

    const gridEl = document.getElementById('grid');
    const numpadEl = document.getElementById('numpad');

    function initGrid() {
        gridEl.innerHTML = '';
        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.index = i;
            
            // Gestion de la sélection multiple (Souris + Glisser + Ctrl)
            cell.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                handleCellSelection(i, e);
            });
            cell.addEventListener('mouseenter', (e) => {
                if (isMouseDown) {
                    handleCellSelection(i, e, true);
                }
            });

            gridEl.appendChild(cell);
        }
        
        window.addEventListener('mouseup', () => {
            isMouseDown = false;
        });

        renderBoard();
        renderNumpad();
    }

    function handleCellSelection(index, e, isDragging = false) {
        if (!e.ctrlKey && !e.metaKey && !isDragging) {
            selectedCells.clear();
        }
        selectedCells.add(index);
        updateSelectionUI();
    }

    function updateSelectionUI() {
        document.querySelectorAll('.cell').forEach(c => {
            const idx = parseInt(c.dataset.index);
            if (selectedCells.has(idx)) {
                c.classList.add('selected');
            } else {
                c.classList.remove('selected');
            }
        });
    }

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active-mode'));
        if(mode !== 'color') {
            document.getElementById(`mode-${mode}`).classList.add('active-mode');
        } else {
            document.getElementById('mode-color').classList.add('active-mode');
        }
        renderNumpad();
    }

    function renderNumpad() {
        numpadEl.innerHTML = '';
        const titleEl = document.getElementById('numpad-title');
        
        if (currentMode === 'color') {
            titleEl.textContent = 'Palette de Couleurs';
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = `color-btn-${i}`;
                btn.textContent = i;
                btn.onclick = () => handleNumpadInput(i);
                numpadEl.appendChild(btn);
            }
        } else {
            titleEl.textContent = 'Pavé Numérique';
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.onclick = () => handleNumpadInput(i);
                numpadEl.appendChild(btn);
            }
        }
    }

    function handleNumpadInput(num) {
        if (selectedCells.size === 0) return;
        saveState();

        selectedCells.forEach(index => {
            let cellData = board[index];

            if (currentMode === 'digit') {
                if (!cellData.locked) {
                    cellData.value = num;
                    cellData.centerNotes.clear();
                    cellData.cornerNotes.clear();
                    cellData.userPlaced = isLocked;
                }
            } else if (currentMode === 'center') {
                if (cellData.value === 0) {
                    if (cellData.centerNotes.has(num)) cellData.centerNotes.delete(num);
                    else cellData.centerNotes.add(num);
                }
            } else if (currentMode === 'corner') {
                if (cellData.value === 0) {
                    if (cellData.cornerNotes.has(num)) cellData.cornerNotes.delete(num);
                    else cellData.cornerNotes.add(num);
                }
            } else if (currentMode === 'color') {
                const colors = ['#ffcccc', '#ffe5cc', '#ffffcc', '#e5ffcc', '#ccffcc', '#ccffe5', '#ccffff', '#cce5ff', '#e5ccff'];
                cellData.color = cellData.color === colors[num-1] ? null : colors[num-1];
            }
        });
        renderBoard();
    }

    function clearData() {
        if (selectedCells.size === 0) return;
        saveState();

        selectedCells.forEach(index => {
            let cellData = board[index];

            if (currentMode === 'digit' && cellData.value !== 0) {
                if (!cellData.locked) cellData.value = 0;
            } else if (currentMode === 'center' && cellData.centerNotes.size > 0) {
                cellData.centerNotes.clear();
            } else if (currentMode === 'corner' && cellData.cornerNotes.size > 0) {
                cellData.cornerNotes.clear();
            } else if (currentMode === 'color' && cellData.color !== null) {
                cellData.color = null;
            } else {
                if (!cellData.locked) {
                    cellData.value = 0;
                    cellData.centerNotes.clear();
                    cellData.cornerNotes.clear();
                    cellData.color = null;
                }
            }
        });
        renderBoard();
    }

    function toggleLock() {
        isLocked = !isLocked;
        const btn = document.getElementById('lock-btn');
        if (isLocked) {
            btn.textContent = '🔓 Unlock';
            btn.style.background = '#ffc107';
            board.forEach(cell => {
                if (cell.value !== 0) cell.locked = true;
            });
        } else {
            btn.textContent = '🔒 Lock';
            btn.style.background = '';
        }
        renderBoard();
    }

    function renderBoard() {
        const cells = gridEl.children;
        for (let i = 0; i < 81; i++) {
            const cellData = board[i];
            const cellEl = cells[i];
            cellEl.innerHTML = '';
            cellEl.style.backgroundColor = cellData.color || 'white';

            if (cellData.value !== 0) {
                const valSpan = document.createElement('span');
                valSpan.className = 'cell-value';
                if (cellData.locked) valSpan.classList.add('locked');
                else if (cellData.userPlaced) valSpan.classList.add('user-placed');
                else valSpan.classList.add('locked');
                valSpan.textContent = cellData.value;
                cellEl.appendChild(valSpan);
            } else {
                if (cellData.centerNotes.size > 0) {
                    const centerDiv = document.createElement('div');
                    centerDiv.className = 'center-notes';
                    centerDiv.textContent = Array.from(cellData.centerNotes).sort().join(' ');
                    cellEl.appendChild(centerDiv);
                }
                if (cellData.cornerNotes.size > 0) {
                    const cornerDiv = document.createElement('div');
                    cornerDiv.className = 'corner-notes';
                    cornerDiv.textContent = Array.from(cellData.cornerNotes).sort().join('');
                    cellEl.appendChild(cornerDiv);
                }
            }
        }
        updateSelectionUI();
    }

    function undo() {
        if (history.length === 0) return;
        redoStack.push(JSON.stringify(board));
        board = JSON.parse(history.pop());
        renderBoard();
    }

    function redo() {
        if (redoStack.length === 0) return;
        history.push(JSON.stringify(board));
        board = JSON.parse(redoStack.pop());
        renderBoard();
    }

    function resetGrid() {
        if(confirm("Voulez-vous vraiment vider toute la grille ?")) {
            board = Array(81).fill().map(() => ({
                value: 0, centerNotes: new Set(), cornerNotes: new Set(), color: null, locked: false, userPlaced: false
            }));
            isLocked = false;
            history = [];
            redoStack = [];
            selectedCells.clear();
            document.getElementById('lock-btn').textContent = '🔒 Lock';
            document.getElementById('lock-btn').style.background = '';
            renderBoard();
        }
    }

    function checkGrid() {
        alert("Vérification basique effectuée.");
    }

    initGrid();
</script>
</body>
</html>
