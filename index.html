<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Application Sudoku</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { margin-bottom: 10px; color: #333; }
        .game-container {
            display: flex;
            gap: 20px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        /* Grille de Sudoku */
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 45px);
            grid-template-rows: repeat(9, 45px);
            border: 3px solid #333;
            background-color: #333;
            gap: 1px;
        }
        .cell {
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            user-select: none;
        }
        /* Épaississement des bordures 3x3 */
        .cell:nth-child(3n) { border-right: 2px solid #333; }
        .cell:nth-child(9n) { border-right: none; }
        .sudoku-grid > div:nth-child(n+19):nth-child(-n+27),
        .sudoku-grid > div:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid #333;
        }
        .cell.selected { background-color: #bbdefb !important; }

        /* Styles des chiffres et annotations */
        .cell-value { z-index: 2; }
        .locked { color: #000 !important; }
        .user-placed { color: #1976d2; }
        
        .center-notes {
            position: absolute;
            font-size: 10px;
            color: #666;
            text-align: center;
            width: 100%;
            letter-spacing: 1px;
            z-index: 1;
        }
        .corner-notes {
            position: absolute;
            font-size: 9px;
            color: #555;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 2px;
            box-sizing: border-box;
            z-index: 1;
        }
        .corner-notes span {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Panneau de contrôle */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 250px;
        }
        .section-title { font-size: 14px; font-weight: bold; color: #555; margin-bottom: 5px; }
        
        .modes, .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }
        button {
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #f8f9fa;
            transition: all 0.2s;
        }
        button:hover { background: #e2e6ea; }
        button.active-mode { background: #007bff; color: white; border-color: #0056b3; }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
        }
        .actions button { font-size: 14px; }
        .full-width { grid-column: span 2; }

        /* Couleurs de surbrillance */
        .color-btn-1 { background-color: #ffcccc !important; }
        .color-btn-2 { background-color: #ffe5cc !important; }
        .color-btn-3 { background-color: #ffffcc !important; }
        .color-btn-4 { background-color: #e5ffcc !important; }
        .color-btn-5 { background-color: #ccffcc !important; }
        .color-btn-6 { background-color: #ccffe5 !important; }
        .color-btn-7 { background-color: #ccffff !important; }
        .color-btn-8 { background-color: #cce5ff !important; }
        .color-btn-9 { background-color: #e5ccff !important; }
    </style>
</head>
<body>

    <h1>Mon Application Sudoku</h1>
    <div class="game-container">
        <!-- Grille 9x9 -->
        <div class="sudoku-grid" id="grid"></div>

        <!-- Contrôles et options -->
        <div class="control-panel">
            <div>
                <div class="section-title">Modes de saisie</div>
                <div class="modes">
                    <button id="mode-digit" class="active-mode" onclick="setMode('digit')">Chiffre</button>
                    <button id="mode-center" onclick="setMode('center')">Notes C.</button>
                    <button id="mode-corner" onclick="setMode('corner')">Notes Coin</button>
                    <button id="mode-color" onclick="setMode('color')" class="full-width">Couleurs</button>
                </div>
            </div>

            <div>
                <div class="section-title" id="numpad-title">Pavé Numérique</div>
                <div class="numpad" id="numpad">
                    <!-- Généré dynamiquement en JS -->
                </div>
            </div>

            <div>
                <div class="section-title">Actions</div>
                <div class="actions">
                    <button onclick="clearData()">🗑️ Poubelle</button>
                    <button onclick="toggleLock()" id="lock-btn">🔒 Cadenas</button>
                    <button onclick="undo()">⬅️ Annuler</button>
                    <button onclick="redo()">➡️ Rétablir</button>
                    <button onclick="resetGrid()">🔄 Reset</button>
                    <button onclick="checkGrid()" style="background-color: #28a745; color: white;">✔️ Check</button>
                </div>
            </div>
        </div>
    </div>

<script>
    const GRID_SIZE = 9;
    let selectedCell = null;
    let currentMode = 'digit'; // 'digit', 'center', 'corner', 'color'
    let isLocked = false;
    
    // Structure de données de la grille
    let board = Array(81).fill().map(() => ({
        value: 0,
        centerNotes: new Set(),
        cornerNotes: new Set(),
        color: null,
        locked: false,
        userPlaced: false
    }));

    let history = [];
    let redoStack = [];

    function saveState() {
        history.push(JSON.stringify(board));
        redoStack = []; // Vider la pile redo à chaque nouvelle action
    }

    const gridEl = document.getElementById('grid');
    const numpadEl = document.getElementById('numpad');

    // Initialisation de la grille graphique
    function initGrid() {
        gridEl.innerHTML = '';
        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.index = i;
            cell.addEventListener('click', () => selectCell(i));
            gridEl.appendChild(cell);
        }
        renderBoard();
        renderNumpad();
    }

    // Sélection d'une case
    function initColors() {} // helper
    function selectCell(index) {
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
        selectedCell = index;
        gridEl.children[index].classList.add('selected');
    }

    // Gestion des modes
    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active-mode'));
        if(mode !== 'color') {
            document.getElementById(`mode-${mode}`).classList.add('active-mode');
        } else {
            document.getElementById('mode-color').classList.add('active-mode');
        }
        renderNumpad();
    }

    // Rendu dynamique du pavé numérique / couleurs
    function renderNumpad() {
        numpadEl.innerHTML = '';
        const titleEl = document.getElementById('numpad-title');
        
        if (currentMode === 'color') {
            titleEl.textContent = 'Palette de Couleurs';
            const colors = ['#ffcccc', '#ffe5cc', '#ffffcc', '#e5ffcc', '#ccffcc', '#ccffe5', '#ccffff', '#cce5ff', '#e5ccff'];
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = `color-btn-${i}`;
                btn.textContent = i;
                btn.onclick = () => handleNumpadInput(i);
                numpadEl.appendChild(btn);
            }
        } else {
            titleEl.textContent = 'Pavé Numérique';
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.onclick = () => handleNumpadInput(i);
                numpadEl.appendChild(btn);
            }
        }
    }

    // Action du pavé numérique
    function handleNumpadInput(num) {
        if (selectedCell === null) return;
        let cellData = board[selectedCell];

        if (currentMode === 'digit') {
            if (cellData.locked) return; // Insuprimmable si verrouillé
            saveState();
            cellData.value = num;
            cellData.centerNotes.clear();
            cellData.cornerNotes.clear();
            cellData.userPlaced = isLocked; // Si le cadenas est fermé, c'est un chiffre utilisateur après verrouillage
        } else if (currentMode === 'center') {
            if (cellData.value !== 0) return;
            saveState();
            if (cellData.centerNotes.has(num)) cellData.centerNotes.delete(num);
            else cellData.centerNotes.add(num);
        } else if (currentMode === 'corner') {
            if (cellData.value !== 0) return;
            saveState();
            if (cellData.cornerNotes.has(num)) cellData.cornerNotes.delete(num);
            else cellData.cornerNotes.add(num);
        } else if (currentMode === 'color') {
            saveState();
            const colors = ['#ffcccc', '#ffe5cc', '#ffffcc', '#e5ffcc', '#ccffcc', '#ccffe5', '#ccffff', '#cce5ff', '#e5ccff'];
            cellData.color = cellData.color === colors[num-1] ? null : colors[num-1];
        }
        renderBoard();
    }

    // Bouton Poubelle
    function clearData() {
        if (selectedCell === null) return;
        let cellData = board[selectedCell];
        saveState();

        if (currentMode === 'digit' && cellData.value !== 0) {
            if (!cellData.locked) cellData.value = 0;
        } else if (currentMode === 'center' && cellData.centerNotes.size > 0) {
            cellData.centerNotes.clear();
        } else if (currentMode === 'corner' && cellData.cornerNotes.size > 0) {
            cellData.cornerNotes.clear();
        } else if (currentMode === 'color' && cellData.color !== null) {
            cellData.color = null;
        } else {
            // Si aucune donnée liée au mode actif, tout effacer (sauf verrouillé)
            if (!cellData.locked) {
                cellData.value = 0;
                cellData.centerNotes.clear();
                cellData.cornerNotes.clear();
                cellData.color = null;
            }
        }
        renderBoard();
    }

    // Bouton Cadenas
    function toggleLock() {
        isLocked = !isLocked;
        const btn = document.getElementById('lock-btn');
        if (isLocked) {
            btn.textContent = '🔓 Ouvrir Cadenas';
            btn.style.background = '#ffc107';
            // Verrouiller tous les chiffres actuels en noir et non supprimables
            board.forEach(cell => {
                if (cell.value !== 0) {
                    cell.locked = true;
                }
            });
        } else {
            btn.textContent = '🔒 Cadenas';
            btn.style.background = '';
        }
        renderBoard();
    }

    // Affichage graphique du plateau
    function renderBoard() {
        const cells = gridEl.children;
        for (let i = 0; i < 81; i++) {
            const cellData = board[i];
            const cellEl = cells[i];
            cellEl.innerHTML = '';
            cellEl.style.backgroundColor = cellData.color || 'white';
            if (i === selectedCell) cellEl.classList.add('selected');

            if (cellData.value !== 0) {
                const valSpan = document.createElement('span');
                valSpan.className = 'cell-value';
                if (cellData.locked) valSpan.classList.add('locked');
                else if (cellData.userPlaced) valSpan.classList.add('user-placed');
                else valSpan.classList.add('locked'); // Par défaut les chiffres initiaux sont noirs
                valSpan.textContent = cellData.value;
                cellEl.appendChild(valSpan);
            } else {
                if (cellData.centerNotes.size > 0) {
                    const centerDiv = document.createElement('div');
                    centerDiv.className = 'center-notes';
                    centerDiv.textContent = Array.from(cellData.centerNotes).sort().join(' ');
                    cellEl.appendChild(centerDiv);
                }
                if (cellData.cornerNotes.size > 0) {
                    const cornerDiv = document.createElement('div');
                    cornerDiv.className = 'corner-notes';
                    for (let n = 1; n <= 9; n++) {
                        const span = document.createElement('span');
                        span.textContent = cellData.cornerNotes.has(n) ? n : '';
                        cornerDiv.appendChild(span);
                    }
                    cellEl.appendChild(cornerDiv);
                }
            }
        }
    }

    // Undo / Redo
    function undo() {
        if (history.length === 0) return;
        redoStack.push(JSON.stringify(board));
        board = JSON.parse(history.pop());
        renderBoard();
    }

    function redo() {
        if (redoStack.length === 0) return;
        history.push(JSON.stringify(board));
        board = JSON.parse(redoStack.pop());
        renderBoard();
    }

    function resetGrid() {
        if(confirm("Voulez-vous vraiment vider toute la grille ?")) {
            saveState();
            board = Array(81).fill().map(() => ({
                value: 0, centerNotes: new Set(), cornerNotes: new Set(), color: null, locked: false, userPlaced: false
            }));
            isLocked = false;
            document.getElementById('lock-btn').textContent = '🔒 Cadenas';
            document.getElementById('lock-btn').style.background = '';
            renderBoard();
        }
    }

    function checkGrid() {
        alert("Vérification basique effectuée. (Fonctionnalité prête à être personnalisée selon vos règles de validation !)");
    }

    // Lancement au démarrage
    initGrid();
</script>
</body>
</html>
