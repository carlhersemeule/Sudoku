
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Application Sudoku</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f0f2f5;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #222;
}

h1 {
    margin: 5px 0 20px;
    font-size: 28px;
}

.app {
    width: 100%;
    max-width: 650px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
}

#sudoku {
    width: min(92vw, 540px);
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    background: white;
    border: 3px solid #222;
    user-select: none;
}

.cell {
    position: relative;
    border: 1px solid #c5cbd2;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    cursor: pointer;
    min-width: 0;
    min-height: 0;
}

.cell:nth-child(3n) {
    border-right: 2px solid #222;
}

.cell:nth-child(9n) {
    border-right: none;
}

.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54) {
    border-bottom: 2px solid #222;
}

.cell.selected {
    background: #dcecff !important;
    outline: 2px solid #4389d6;
    outline-offset: -2px;
    z-index: 3;
}

.cell.locked {
    background: #f0f0f0;
}

.digit {
    font-size: clamp(20px, 5vw, 30px);
    font-weight: 500;
    color: #1875c9;
    z-index: 2;
    pointer-events: none;
}

.digit.locked-digit {
    color: #111;
    font-weight: 600;
}

.center-notes {
    position: absolute;
    font-size: clamp(9px, 2.2vw, 12px);
    color: #444;
    text-align: center;
    width: 100%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    letter-spacing: 0;
    word-spacing: 1px;
    line-height: 1;
    white-space: nowrap;
    z-index: 2;
    pointer-events: none;
}

.corner-notes {
    position: absolute;
    font-size: clamp(8px, 1.9vw, 11px);
    color: #444;
    top: 3px;
    left: 4px;
    letter-spacing: 1px;
    line-height: 1.1;
    z-index: 2;
    pointer-events: none;
}

.controls {
    width: min(92vw, 540px);
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.button-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 7px;
}

button {
    border: 1px solid #c5cbd2;
    border-radius: 6px;
    background: white;
    padding: 9px 13px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s;
}

button:hover {
    background: #e9edf2;
}

button.active {
    background: #246fbd;
    border-color: #246fbd;
    color: white;
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.section-title {
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 5px;
}

.number-pad {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 5px;
}

.number-pad button {
    padding: 12px 0;
    font-size: 19px;
    font-weight: bold;
}

.color-pad {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 6px;
}

.color-button {
    height: 34px;
    padding: 0;
    border: 2px solid #aaa;
}

.color-button.active {
    border: 3px solid #222;
    outline: 2px solid white;
}

.status {
    min-height: 22px;
    text-align: center;
    font-size: 14px;
    color: #444;
}

.help {
    font-size: 12px;
    color: #666;
    text-align: center;
    line-height: 1.5;
}

@media (max-width: 450px) {
    body {
        padding: 10px 5px;
    }

    button {
        padding: 8px 10px;
        font-size: 12px;
    }

    .number-pad button {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<h1>Mon Sudoku</h1>

<div class="app">

    <div id="sudoku"></div>

    <div class="controls">

        <div>
            <div class="section-title">Mode de saisie</div>
            <div class="button-row">
                <button class="mode-button active" data-mode="digit">Chiffres</button>
                <button class="mode-button" data-mode="center">Notes centrales</button>
                <button class="mode-button" data-mode="corner">Notes coin</button>
                <button class="mode-button" data-mode="color">Couleurs</button>
            </div>
        </div>

        <div id="numberSection">
            <div class="section-title">Chiffres</div>
            <div class="number-pad" id="numberPad"></div>
        </div>

        <div id="colorSection" style="display:none;">
            <div class="section-title">Choisir une couleur</div>
            <div class="color-pad" id="colorPad"></div>
        </div>

        <div class="button-row">
            <button id="trashButton">🗑 Supprimer</button>
            <button id="lockButton">🔒 Verrouiller</button>
            <button id="undoButton" disabled>↶ Annuler</button>
            <button id="redoButton" disabled>↷ Rétablir</button>
        </div>

        <div class="button-row">
            <button id="checkButton">Vérifier</button>
            <button id="resetButton">Réinitialiser</button>
        </div>

        <div class="status" id="status"></div>

        <div class="help">
            Sélection multiple : maintiens Ctrl ou Cmd et clique sur plusieurs cases.
            Tu peux également sélectionner plusieurs cases en faisant glisser la souris.
            <br>
            Raccourcis : Ctrl + Z pour annuler, Ctrl + Y pour rétablir.
        </div>

    </div>
</div>

<script>
const sudoku = document.getElementById("sudoku");
const numberPad = document.getElementById("numberPad");
const colorPad = document.getElementById("colorPad");
const statusBox = document.getElementById("status");

const colors = [
    "#ff9999",
    "#ffbf80",
    "#ffff80",
    "#b3e699",
    "#80d980",
    "#80e6c2",
    "#80dddd",
    "#80bfff",
    "#c299ff"
];

let board = Array.from({ length: 81 }, () => ({
    value: "",
    locked: false,
    centerNotes: [],
    cornerNotes: [],
    color: null
}));

let selectedCells = new Set();
let mode = "digit";
let selectedColor = 0;
let lockMode = false;

let history = [];
let historyIndex = -1;

let mouseSelecting = false;
let dragStartCell = null;
let dragSelection = false;


// --------------------------------------------------
// HISTORIQUE
// --------------------------------------------------

function cloneBoard(source) {
    return source.map(cell => ({
        value: cell.value,
        locked: cell.locked,
        centerNotes: [...cell.centerNotes],
        cornerNotes: [...cell.cornerNotes],
        color: cell.color
    }));
}

function saveState() {
    const snapshot = {
        board: cloneBoard(board),
        lockMode: lockMode
    };

    history = history.slice(0, historyIndex + 1);
    history.push(snapshot);

    if (history.length > 200) {
        history.shift();
    }

    historyIndex = history.length - 1;
    updateHistoryButtons();
}

function restoreState(snapshot) {
    board = cloneBoard(snapshot.board);
    lockMode = snapshot.lockMode;

    selectedCells.clear();

    renderBoard();
    updateLockButton();
    updateHistoryButtons();
}

function undo() {
    if (historyIndex <= 0) return;

    historyIndex--;
    restoreState(history[historyIndex]);

    statusBox.textContent = "Action annulée.";
}

function redo() {
    if (historyIndex >= history.length - 1) return;

    historyIndex++;
    restoreState(history[historyIndex]);

    statusBox.textContent = "Action rétablie.";
}

function updateHistoryButtons() {
    document.getElementById("undoButton").disabled =
        historyIndex <= 0;

    document.getElementById("redoButton").disabled =
        historyIndex >= history.length - 1;
}


// --------------------------------------------------
// AFFICHAGE DE LA GRILLE
// --------------------------------------------------

function renderBoard() {
    sudoku.innerHTML = "";

    board.forEach((cellData, index) => {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.index = index;

        if (cellData.color !== null) {
            cell.style.backgroundColor = colors[cellData.color];
        }

        if (selectedCells.has(index)) {
            cell.classList.add("selected");
        }

        if (cellData.locked) {
            cell.classList.add("locked");
        }

        if (cellData.value !== "") {
            const digit = document.createElement("div");
            digit.className = "digit";

            if (cellData.locked) {
                digit.classList.add("locked-digit");
            }

            digit.textContent = cellData.value;
            cell.appendChild(digit);
        } else {
            if (cellData.centerNotes.length > 0) {
                const center = document.createElement("div");
                center.className = "center-notes";
                center.textContent = [...cellData.centerNotes]
                    .sort((a, b) => a - b)
                    .join(" ");
                cell.appendChild(center);
            }

            if (cellData.cornerNotes.length > 0) {
                const corner = document.createElement("div");
                corner.className = "corner-notes";
                corner.textContent = [...cellData.cornerNotes]
                    .sort((a, b) => a - b)
                    .join("");
                cell.appendChild(corner);
            }
        }

        cell.addEventListener("mousedown", event => {
            if (event.button !== 0) return;
            event.preventDefault();

            mouseSelecting = true;
            dragStartCell = index;
            dragSelection = false;

            if (event.ctrlKey || event.metaKey) {
                toggleSelection(index);
            } else {
                selectedCells.clear();
                selectedCells.add(index);
            }

            renderBoard();
        });

        cell.addEventListener("mouseenter", () => {
            if (!mouseSelecting || dragStartCell === null) return;

            dragSelection = true;
            selectedCells.add(index);

            renderBoard();
        });

        sudoku.appendChild(cell);
    });
}

document.addEventListener("mouseup", () => {
    mouseSelecting = false;
    dragStartCell = null;
    dragSelection = false;
});

function toggleSelection(index) {
    if (selectedCells.has(index)) {
        selectedCells.delete(index);
    } else {
        selectedCells.add(index);
    }
}


// --------------------------------------------------
// CHANGEMENT DE MODE
// --------------------------------------------------

function setMode(newMode) {
    mode = newMode;

    document.querySelectorAll(".mode-button").forEach(button => {
        button.classList.toggle("active", button.dataset.mode === mode);
    });

    document.getElementById("numberSection").style.display =
        mode === "color" ? "none" : "block";

    document.getElementById("colorSection").style.display =
        mode === "color" ? "block" : "none";

    statusBox.textContent = "";
}

document.querySelectorAll(".mode-button").forEach(button => {
    button.addEventListener("click", () => {
        setMode(button.dataset.mode);
    });
});


// --------------------------------------------------
// CLAVIER NUMÉRIQUE
// --------------------------------------------------

for (let number = 1; number <= 9; number++) {
    const button = document.createElement("button");
    button.textContent = number;

    button.addEventListener("click", () => {
        handleNumber(number);
    });

    numberPad.appendChild(button);
}

function handleNumber(number) {
    if (selectedCells.size === 0) {
        statusBox.textContent = "Sélectionne d'abord une case.";
        return;
    }

    if (mode === "color") return;

    let changed = false;

    selectedCells.forEach(index => {
        const cell = board[index];

        if (cell.locked) return;

        if (mode === "digit") {
            if (cell.value !== String(number)) {
                cell.value = String(number);
                cell.centerNotes = [];
                cell.cornerNotes = [];
                changed = true;
            }
        }

        if (mode === "center") {
            toggleNote(cell.centerNotes, number);
            changed = true;
        }

        if (mode === "corner") {
            toggleNote(cell.cornerNotes, number);
            changed = true;
        }
    });

    if (changed) {
        saveState();
        renderBoard();
    }

    statusBox.textContent = "";
}

function toggleNote(notes, number) {
    const position = notes.indexOf(number);

    if (position !== -1) {
        notes.splice(position, 1);
    } else {
        notes.push(number);
        notes.sort((a, b) => a - b);
    }
}


// --------------------------------------------------
// PALETTE DE COULEURS
// --------------------------------------------------

colors.forEach((color, index) => {
    const button = document.createElement("button");

    button.className = "color-button";
    button.style.backgroundColor = color;
    button.title = "Couleur " + (index + 1);

    button.addEventListener("click", () => {
        selectedColor = index;

        document.querySelectorAll(".color-button").forEach((item, i) => {
            item.classList.toggle("active", i === index);
        });

        applyColor();
    });

    colorPad.appendChild(button);
});

function applyColor() {
    if (selectedCells.size === 0) {
        statusBox.textContent = "Sélectionne d'abord une case.";
        return;
    }

    let changed = false;

    selectedCells.forEach(index => {
        const cell = board[index];

        if (cell.locked) return;

        if (cell.color !== selectedColor) {
            cell.color = selectedColor;
            changed = true;
        }
    });

    if (changed) {
        saveState();
        renderBoard();
    }

    statusBox.textContent = "";
}


// --------------------------------------------------
// SUPPRESSION
// --------------------------------------------------

function clearData() {
    if (selectedCells.size === 0) {
        statusBox.textContent = "Sélectionne d'abord une case.";
        return;
    }

    let changed = false;

    selectedCells.forEach(index => {
        const cell = board[index];

        let hasDataInCurrentMode = false;

        if (mode === "digit") {
            hasDataInCurrentMode = cell.value !== "";
        } else if (mode === "center") {
            hasDataInCurrentMode = cell.centerNotes.length > 0;
        } else if (mode === "corner") {
            hasDataInCurrentMode = cell.cornerNotes.length > 0;
        } else if (mode === "color") {
            hasDataInCurrentMode = cell.color !== null;
        }

        if (hasDataInCurrentMode) {
            if (mode === "digit") {
                if (!cell.locked && cell.value !== "") {
                    cell.value = "";
                    changed = true;
                }
            } else if (mode === "center") {
                if (cell.centerNotes.length > 0) {
                    cell.centerNotes = [];
                    changed = true;
                }
            } else if (mode === "corner") {
                if (cell.cornerNotes.length > 0) {
                    cell.cornerNotes = [];
                    changed = true;
                }
            } else if (mode === "color") {
                if (cell.color !== null) {
                    cell.color = null;
                    changed = true;
                }
            }
        } else {
            if (!cell.locked && cell.value !== "") {
                cell.value = "";
                changed = true;
            }

            if (cell.centerNotes.length > 0) {
                cell.centerNotes = [];
                changed = true;
            }

            if (cell.cornerNotes.length > 0) {
                cell.cornerNotes = [];
                changed = true;
            }

            if (cell.color !== null) {
                cell.color = null;
                changed = true;
            }
        }
    });

    if (changed) {
        saveState();
        renderBoard();
    }

    statusBox.textContent = "";
}

document.getElementById("trashButton")
    .addEventListener("click", clearData);


// --------------------------------------------------
// VERROUILLAGE
// --------------------------------------------------

function toggleLock() {
    if (!lockMode) {
        board.forEach(cell => {
            if (cell.value !== "") {
                cell.locked = true;
            }
        });

        lockMode = true;
        statusBox.textContent =
            "Les chiffres existants sont verrouillés.";
    } else {
        lockMode = false;
        statusBox.textContent =
            "Mode de verrouillage désactivé.";
    }

    saveState();
    updateLockButton();
    renderBoard();
}

function updateLockButton() {
    const button = document.getElementById("lockButton");

    button.classList.toggle("active", lockMode);

    button.textContent = lockMode
        ? "🔓 Verrouillage actif"
        : "🔒 Verrouiller";
}

document.getElementById("lockButton")
    .addEventListener("click", toggleLock);


// --------------------------------------------------
// VÉRIFICATION DU SUDOKU
// --------------------------------------------------

function checkBoard() {
    const values = board.map(cell => cell.value);

    if (values.some(value => value === "")) {
        statusBox.textContent =
            "La grille n'est pas encore complète.";
        return;
    }

    for (let row = 0; row < 9; row++) {
        const line = values.slice(row * 9, row * 9 + 9);

        if (!isValidGroup(line)) {
            statusBox.textContent =
                "Erreur : un chiffre est répété sur une ligne.";
            return;
        }
    }

    for (let col = 0; col < 9; col++) {
        const column = [];

        for (let row = 0; row < 9; row++) {
            column.push(values[row * 9 + col]);
        }

        if (!isValidGroup(column)) {
            statusBox.textContent =
                "Erreur : un chiffre est répété dans une colonne.";
            return;
        }
    }

    for (let blockRow = 0; blockRow < 3; blockRow++) {
        for (let blockCol = 0; blockCol < 3; blockCol++) {
            const block = [];

            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const index =
                        (blockRow * 3 + row) * 9 + (blockCol * 3 + col);

                    block.push(values[index]);
                }
            }

            if (!isValidGroup(block)) {
                statusBox.textContent =
                    "Erreur : un chiffre est répété dans un bloc.";
                return;
            }
        }
    }

    statusBox.textContent =
        "La grille est complète et ne contient aucune répétition !";
}

function isValidGroup(group) {
    return new Set(group).size === 9;
}

document.getElementById("checkButton")
    .addEventListener("click", checkBoard);


// --------------------------------------------------
// RÉINITIALISATION
// --------------------------------------------------

function resetBoard() {
    if (!confirm("Veux-tu vraiment réinitialiser toute la grille ?")) {
        return;
    }

    board = Array.from({ length: 81 }, () => ({
        value: "",
        locked: false,
        centerNotes: [],
        cornerNotes: [],
        color: null
    }));

    selectedCells.clear();
    lockMode = false;

    history = [];
    historyIndex = -1;

    saveState();

    updateLockButton();
    renderBoard();

    statusBox.textContent = "Grille réinitialisée.";
}

document.getElementById("resetButton")
    .addEventListener("click", resetBoard);


// --------------------------------------------------
// BOUTONS ANNULER ET RÉTABLIR
// --------------------------------------------------

document.getElementById("undoButton")
    .addEventListener("click", undo);

document.getElementById("redoButton")
    .addEventListener("click", redo);


// --------------------------------------------------
// RACCOURCIS CLAVIER
// --------------------------------------------------

document.addEventListener("keydown", event => {
    if (event.ctrlKey || event.metaKey) {
        if (event.key.toLowerCase() === "z") {
            event.preventDefault();
            undo();
        }

        if (event.key.toLowerCase() === "y") {
            event.preventDefault();
            redo();
        }
    }

    if (event.key >= "1" && event.key <= "9") {
        handleNumber(Number(event.key));
    }

    if (event.key === "Delete" || event.key === "Backspace") {
        clearData();
    }
});


// --------------------------------------------------
// INITIALISATION
// --------------------------------------------------

saveState();
renderBoard();
updateLockButton();

</script>

</body>
</html>
